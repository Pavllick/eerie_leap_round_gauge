# The Cortex-A targets enable the MMU, which caps the common libc malloc arena
# at 16 kB - far too little for the C++ runtime and the PMR allocators. The
# arena is placed in RAM, so the kernel virtual address space has to grow with
# it. The remaining QEMU targets already extend the arena into free RAM.
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=8388608
CONFIG_KERNEL_VM_SIZE=0x4000000

CONFIG_FLASH_SIMULATOR=y
CONFIG_GPIO_EMUL=y

CONFIG_DISPLAY=y
CONFIG_INPUT=y

# Memory
# 8MB SRAM
CONFIG_SRAM_SIZE=8388608
# 2MB Heap
CONFIG_HEAP_MEM_POOL_SIZE=2097152
CONFIG_LV_Z_MEM_POOL_SIZE=1048576

# Bluetooth
# ==============================================

CONFIG_BT=y
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="EerieLeap"
CONFIG_BT_SMP=y
CONFIG_BT_USER_DATA_LEN_UPDATE=y
# BT Settings
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_BT_SETTINGS=y

# Tracing
# ==============================================
# See docs/native_sim/TRACING.md for more information on tracing usage.

# CONFIG_TRACING=y
# CONFIG_TRACING_CTF=y
# # POSIX backend requires synchronous tracing (TRACING_BACKEND_RAM is used silently otherwise)
# CONFIG_TRACING_SYNC=y
# CONFIG_TRACING_BACKEND_POSIX=y
